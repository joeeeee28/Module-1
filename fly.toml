# Deploy LearnMate to Fly.io
#   fly launch --name learnmate --no-deploy
#   fly volumes create learnmate_data --size 1
#   fly deploy
app = "learnmate"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"

[[mounts]]
  source = "learnmate_data"
  destination = "/app/data"

[[services]]
  internal_port = 4000
  protocol = "tcp"
  [[services.ports]]
    handlers = ["http"]
    port = 80
